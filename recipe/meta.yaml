{% set name = "lief" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/lief-project/LIEF/archive/refs/tags/{{ version }}.tar.gz
  sha256: 2cf412695ff739d82e129db441e5c2025f3bb4873a3d3a1d3dd4cf300b682abd
  patches:
    - patches/0001-normalize-macos-wheel-tags.patch
    - patches/0002-find-tl-expected-for-shared-builds.patch

build:
  number: 2
  skip: true  # [py<39]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - pkg-config  # [not win]
    - cmake
    - ninja-base
    - git
  host:
    # Check upstream dependencies and pin correct versions (see local cbc.yaml)
    - nlohmann_json {{ nlohmann_json }}
    - mbedtls {{ mbedtls }}
    - cpp-expected {{ cpp_expected }}
    - spdlog {{ spdlog }}

outputs:
  - name: py-lief
    script: install-py-lief.sh  # [unix]
    script: install-py-lief.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('py-lief', max_pin='x.x') }}
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - pkg-config            # [not win]
        - cmake
        - ninja-base
      host:
        - pip
        - python
        # Check upstream dependencies and pin correct versions (see local cbc.yaml)
        - nlohmann_json {{ nlohmann_json }}
        - cpp-expected {{ cpp_expected }}
        - spdlog {{ spdlog }}
        - nanobind {{ nanobind }}
        # Upstream-provided spdlog includes an embedded header-only fmt library.
        # See <source-dir>/third_part/spdlog-*.zip
        # Anaconda's spdlog unvendors fmt, see aggregate's cbc.yaml.
        # However, py-lief uses fmt internally regardless of spdlog unvendoring and the fmt headers transiently included from the spdlog headers.
        # That causes py-lief linking against fmt directly. Therefore, we should link py-lief against the fmt version spdlog is linked against.
        - fmt {{ fmt }}
        # Dynamically linked to libLIEF for now; see comment in patch section.
        - {{ pin_subpackage('liblief', exact=True) }}
        # Upstream pins build dependencies exactly; we are a bit more lenient
        # here to avoid potential solvability issues.
        - pydantic >=2.8.2
        - scikit-build-core >=0.9.8
        - setuptools >=70.2.0 # [unix]
        # Required for msvc.msvc14_get_vc_env
        - setuptools <=74  # [win]
        - tomli >=2.0.1
      run:
        - {{ pin_subpackage('liblief', exact=True) }}
        - python
    test:
      requires:
        - pip >=24.2
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
      files:
        - tests/py-lief
      imports:
        - lief
      commands:
        - python -m pip check
        # Print py-lief version and check it matches the recipe version
        - python -c "import lief; print('PY-LIEF version:', lief.__version__); assert lief.__version__.startswith('{{ version }}'), lief.__version__"
        # Test general functionality by introspecting inter-subpackage linkage.
        # Asserts the selection of imports from libLIEF is non-empty, then that
        # all of them are exported by libLIEF.
        - python tests/py-lief/test_linkage.py

  - name: liblief
    script: install-liblief.sh  # [unix]
    script: install-liblief.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('liblief', max_pin='x.x') }}
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - pkg-config
        - cmake
        - ninja-base
      host:
        # Check upstream dependencies and pin correct versions (see local cbc.yaml)
        - nlohmann_json {{ nlohmann_json }}
        - mbedtls {{ mbedtls }}
        - cpp-expected {{ cpp_expected }}
        - spdlog {{ spdlog }}
        # Upstream-provided spdlog includes an embedded header-only fmt library.
        # See <source-dir>/third_part/spdlog-*.zip
        # Anaconda's spdlog unvendors fmt, see aggregate's cbc.yaml.
        # However, libLIEF uses fmt internally regardless of spdlog unvendoring and the fmt headers transiently included from the spdlog headers.
        # That causes libLIEF linking against fmt directly. Therefore, we should link libLIEF against the fmt version spdlog is linked against.
        - fmt {{ fmt }}
      run:
        # "expected" is required at runtime due to unvendoring
        - {{ pin_compatible('cpp-expected', max_pin='x.x') }}
    test:
      files:
        - tests
      commands:
        - set -x   # [not win]
        - echo on  # [win]
        - pushd tests
        # Aid uniform tests below: Put current dir bluntly on PATH; alias "findstr"->"grep", "call;"->"true".
        - PATH=".:${PATH}"            # [not win]
        - findstr() { grep "${@}"; }  # [not win]
        - call() { true; }            # [not win]

        - pushd self
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug . || exit 1
        - ninja || exit 1
        # FIXME: Actual test disabled on Windows for now; LIEF::Parser::parse does not finish on Windows.
        - test-lief-self || exit 1  # [not win]
        - popd

        - pushd macho
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug . || exit 1
        - ninja || exit 1
        # This MachO object has no DynamicSymbolCommand, testing for bug fixed in PR:
        # https://github.com/lief-project/LIEF/pull/262
        # FIXME: Actual test disabled on Windows for now; LIEF::MachO::Parser::parse does not finish on Windows.
        - test-lief-macho macOS-libpython2.7.a-getbuildinfo.o > output.txt || exit 1  # [not win]
        - findstr has_dynamic_symbol_command output.txt && exit 1 || call;
        - popd

        # Tests find_package(LIEF) config and that unvendored libraries leaking through the public headers resolves.
        # Builds a shared library and parses it with LIEF.
        - pushd liblief
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="${PREFIX}" . || exit 1  # [not win]
        # Release on Windows: LIEF.dll is built Release, and a Debug app (_ITERATOR_DEBUG_LEVEL=2) has a different std::string layout,
        # so strings passed across the DLL boundary arrive empty.
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%PREFIX%" . || exit 1  # [win]
        - ninja || exit 1
        - ctest --output-on-failure
        - popd

        - popd
      requires:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja-base

about:
  home: https://lief-project.github.io/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: A cross platform library to parse, modify and abstract ELF, PE and MachO formats.
  description: |
    It turns out that many projects need to parse executable formats and they usually re-implement
    their own parser. Moreover these parsers are usually bound to one language.
    LIEF attempts to fill this void.
  dev_url: https://github.com/lief-project/LIEF
  doc_url: https://lief-project.github.io/doc/latest/

extra:
  recipe-maintainers:
    - isuruf
    - mbargull
    - msarahan
    - xhochy
    - wolfv
