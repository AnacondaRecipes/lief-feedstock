# Dependency version pins defined by the upstream.
# These might be different from aggregate's version pins. See '<src-dir>/third-party' directory for more details.
nlohmann_json:
  - 3.12.0
mbedtls:
  - 4.0.0
cpp_expected:
  - 1.3.1
# Upstream defines a strict spdlog version, but spdlog devs claim that they have a stable interface.
# See: https://github.com/gabime/spdlog/discussions/2741
# Therefore, the version pin can be relaxed.
# This is the same as aggregate's cbc.yaml (as of Oct 2026). Let's keep it here as well for future compatibility.
spdlog:
  - 1
nanobind:
  - 2.13.0
